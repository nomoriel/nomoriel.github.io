# Each topic is a group of papers. image, image_width and image_height are optional.
publication_topics:
  - topic: Foundation models for biology
    papers:
      - title: >-
          Toward a coherent virtual cell model: probing biological world-model coherence in
          transcriptomic foundation models
        url: https://openreview.net/forum?id=nLy3iIONkt
        authors: Noa Moriel, Yishai Shimoni, Michal Rosen-Zvi, Michael M. Danziger
        venue: NeurIPS 2025 workshop
        venue_note: AI for virtual cells and drug discovery (AI4D3)
        image: files/virtual_cell_fig1.png
        image_width: 640
        image_height: 640
        image_alt: >-
          Pretraining loss landscape over gene expression space: low for real cells, high for
          shuffled and interpolated samples
        summary: >-
          Can a transcriptomic foundation model tell a real cell from a shuffled one? We propose a
          model-agnostic test based on synthetic samples and pretraining loss. Models separate real
          from shuffled cells and show loss barriers between distant cell types, but a coherent
          world model is far from universal.
        links:
          - label: Paper
            url: https://openreview.net/forum?id=nLy3iIONkt
          - label: PDF
            url: https://ai4d3.github.io/2025/papers/26_Toward_a_Coherent_Virtual_C.pdf
          - label: IBM Research
            url: https://research.ibm.com/publications/toward-a-coherent-virtual-cell-model-probing-biological-world-model-coherence-in-transcriptomic-foundation-models

  - topic: Machine learning for dynamical systems
    papers:
      - title: "Let's do the time-warp-attend: learning topological invariants of dynamical systems"
        url: https://openreview.net/forum?id=Fj7Fzm5lWL
        authors: >-
          Noa Moriel*, [Matthew Ricci](https://matthew-ricci.net/)*,
          [Mor Nitzan](https://www.nitzanlab.com/)
        venue: ICLR 2024
        image: files/twa_crop.png
        image_width: 261
        image_height: 224
        image_alt: Cell-cycle scores predicted by time-warp-attend on single-cell gene expression
        summary: >-
          A deep-learning framework that classifies dynamical regimes and detects bifurcation
          boundaries by learning topologically invariant features, from electrical circuits to gene
          expression in pancreatic development.
        links:
          - label: Paper
            url: https://openreview.net/forum?id=Fj7Fzm5lWL
          - label: Code
            url: https://github.com/nitzanlab/time-warp-attend

      - title: "Phase2vec: dynamical systems embedding with a physics-informed convolutional network"
        url: https://openreview.net/forum?id=z9C5dGip90
        authors: >-
          [Matthew Ricci](https://matthew-ricci.net/), Noa Moriel,
          [Zoe Piran](https://www.zoepiran.com/en/latest/), [Mor Nitzan](https://www.nitzanlab.com/)
        venue: ICLR 2023
        highlight: Oral
        image: files/phase2vec_crop.png
        image_width: 612
        image_height: 411
        image_alt: Phase2vec embedding of dynamical systems
        summary: >-
          An unsupervised embedding of dynamical systems that classifies them into physical classes
          such as stability and energy conservation, and predicts equations from data, with an
          application to meteorological data.
        links:
          - label: Paper
            url: https://openreview.net/forum?id=z9C5dGip90
          - label: Code
            url: https://github.com/nitzanlab/phase2vec/

  - topic: Single-cell and spatial genomics
    papers:
      - title: Optimal sequencing budget allocation for trajectory reconstruction of single cells
        url: https://doi.org/10.1093/bioinformatics/btae258
        authors: >-
          Noa Moriel*, [Edvin Memet](https://softmath.seas.harvard.edu/lab-member/edvin-memet/)*,
          [Mor Nitzan](https://www.nitzanlab.com/)
        venue: ISMB 2024
        venue_note: Bioinformatics
        image: files/limitations.gif
        image_width: 432
        image_height: 288
        image_alt: Trajectory reconstruction as sequencing breadth and depth change
        summary: >-
          With a fixed sequencing budget, should you sequence more cells or each cell more deeply?
          We show reconstruction accuracy scales with the logarithm of either, and that the best
          allocation follows a power law in the budget.
        links:
          - label: Paper
            url: https://doi.org/10.1093/bioinformatics/btae258
          - label: Code
            url: https://github.com/nitzanlab/trajectory_reconstruction_tradeoff/

      - title: Emergence of division of labor in tissues through cell interactions and spatial cues
        url: https://www.sciencedirect.com/science/article/pii/S2211124723004230
        authors: >-
          [Miri Adler](https://www.adler-lab.com/)*, Noa Moriel*,
          [Aleksandrina Goeva](https://tudaga.github.io/)*, …,
          [Aviv Regev](https://www.gene.com/scientists/our-scientists/aviv-regev),
          [Ruslan Medzhitov](https://medicine.yale.edu/profile/ruslan-medzhitov/?tab=bio),
          [Mor Nitzan](https://www.nitzanlab.com/)
        venue: Cell Reports 2023
        image: files/pareto_crop.jpg
        image_width: 458
        image_height: 204
        image_alt: Pareto front of specialist cell archetypes
        summary: >-
          How do tissues organize division of labor in space? We contrast spatial gradients with
          cell–cell interactions and find signatures of both, in intestine enterocytes and colon
          fibroblasts.
        links:
          - label: Paper
            url: https://www.sciencedirect.com/science/article/pii/S2211124723004230
          - label: Code
            url: https://github.com/nitzanlab/pareto_interactions_py

      - title: >-
          TACCO unifies annotation transfer and decomposition of cell identities for single-cell
          and spatial omics
        url: https://www.nature.com/articles/s41587-023-01657-3
        authors: >-
          [Simon Mages](https://www.genzentrum.uni-muenchen.de/research-groups/mages/index.html)*,
          Noa Moriel*, …,
          [Johanna Klughammer](https://www.genzentrum.uni-muenchen.de/research-groups/klughammer/index.html),
          [Aviv Regev](https://www.gene.com/scientists/our-scientists/aviv-regev),
          [Mor Nitzan](https://www.nitzanlab.com/)
        venue: Nature Biotechnology 2023
        image: files/tacco.png
        image_width: 384
        image_height: 284
        image_alt: TACCO annotation transfer overview
        summary: >-
          A framework that transfers annotations from reference data to single-cell and spatial
          omics at scale, supporting expression decomposition, cell fate prediction and recovery
          from read dropout. We used it to map spatially defined functional units in colorectal
          cancer ([eLife 2025](https://elifesciences.org/articles/104815)).
        links:
          - label: Paper
            url: https://www.nature.com/articles/s41587-023-01657-3
          - label: Code
            url: https://github.com/simonwm/tacco
          - label: Colorectal cancer paper
            url: https://elifesciences.org/articles/104815

      - title: >-
          NovoSpaRc: flexible spatial reconstruction of single-cell gene expression with optimal
          transport
        url: https://doi.org/10.1038/s41596-021-00573-7
        authors: >-
          Noa Moriel*, [Enes Senel](https://scholar.google.com.tr/citations?user=1Nas6ZQAAAAJ&hl=en)*,
          [Nir Friedman](https://www.cs.huji.ac.il/w~nirf/),
          [Nikolaus Rajewsky](https://www.mdc-berlin.de/n-rajewsky),
          [Nikos Karaiskos](https://nukappa.github.io/), [Mor Nitzan](https://www.nitzanlab.com/)
        venue: Nature Protocols 2021
        image: files/novosparc_crop.jpg
        image_width: 273
        image_height: 177
        image_alt: novoSpaRc reconstruction of a Drosophila embryo
        summary: >-
          An optimal transport algorithm that reconstructs tissue structure from single-cell
          RNA-seq, optionally guided by a reference atlas, with a step-by-step guide on the
          Drosophila embryo.
        links:
          - label: Paper
            url: https://doi.org/10.1038/s41596-021-00573-7
          - label: Code
            url: https://pypi.org/project/novosparc

