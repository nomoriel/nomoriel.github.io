bio:
  - >-
    I am interested in the underlying principles that give rise to biological complexity, and in how
    information emerges through machine learning paradigms. Across my academic and industry work, I
    have been fortunate to study these fundamental questions and to apply what I learned across
    fields, including video editing, autonomous driving, dynamical systems and cell foundation models.

